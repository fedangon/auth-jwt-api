spring.application.name=auth-jwt-api

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_jwt_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (Base64 de 32 bytes para HS256)
security.jwt.secret=${JWT_SECRET_BASE64:QANfQxIr0diQ36PMyKo4fDoP4rgRBjl2ho8D4uV7p4Y=}
security.jwt.issuer=${JWT_ISSUER:https://auth-jwt-api}
security.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
security.jwt.clock-skew=${JWT_CLOCK_SKEW:PT30S}

# Refresh token (armazenado no banco como hash)
security.refresh-token.ttl=${REFRESH_TOKEN_TTL:P7D}
