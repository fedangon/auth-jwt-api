services:
  postgres:
    image: postgres:16
    container_name: auth-jwt-api-postgres
    environment:
      POSTGRES_DB: auth_jwt_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth_jwt_api_pg_data:/var/lib/postgresql/data

volumes:
  auth_jwt_api_pg_data:

